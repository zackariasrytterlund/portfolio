<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zackarias Rytterlund – Digital Designer</title>
  <meta name="description" content="Portfolio för Zackarias Rytterlund, digital designer i Göteborg.">

  <!-- Typsnitt: Space Grotesk (rubriker) och Inter (brödtext) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Pilarna ← → ingår inte i Googles standardurval, så de hämtas separat (måste ligga först) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500&text=%E2%86%90%E2%86%92&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Space+Grotesk:wght@500;700&display=swap">

  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/sections.css">

  <script src="js/main.js" defer></script>
</head>
<body>
  <div class="page">

    <header class="site-header">
      <nav class="nav" aria-label="Huvudmeny">
        <div class="nav__bar">
          <a class="nav__name link-sm" href="./">Zackarias Rytterlund</a>

          <!-- Desktop -->
          <ul class="nav__links">
            <li><a class="link link-sm" href="#case">Case</a></li>
            <li><a class="link link-sm" href="#about">About</a></li>
            <li><a class="link link-sm" href="#contact">Contact</a></li>
          </ul>

          <!-- Mobil -->
          <button class="nav__toggle link link-sm" type="button" aria-expanded="false" aria-controls="nav-menu">Menu</button>
        </div>

        <div class="nav__menu" id="nav-menu">
          <div class="nav__menu-inner">
            <ul>
              <li><a class="link link-lg" href="#case">Case</a></li>
              <li><a class="link link-lg" href="#about">About</a></li>
              <li><a class="link link-lg" href="#contact">Contact</a></li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <!-- Hero -->
      <section class="hero grid" aria-labelledby="hero-title">
        <h1 id="hero-title" class="heading hero__title">Digital Designer based in Gothenburg</h1>

        <!-- Platshållare: byt till <img src="images/..." alt="..."> inuti varje kort -->
        <div class="media-card media-card--16-9 hero__card-1"></div>
        <div class="media-card media-card--4-5 hero__card-2"></div>
        <div class="media-card media-card--5-4 hero__card-3"></div>
        <div class="media-card media-card--5-4 hero__card-4"></div>
        <div class="media-card media-card--5-4 hero__card-5"></div>
      </section>

      <!-- Content slider -->
      <section class="slider grid" aria-label="Projektbilder">
        <div class="slider__track" tabindex="0" aria-label="Bilder, svep eller använd pilarna">
          <!-- Platshållare: byt till <img src="images/..." alt="..."> inuti varje kort -->
          <div class="media-card media-card--4-5"></div>
          <div class="media-card media-card--4-5"></div>
          <div class="media-card media-card--4-5"></div>
          <div class="media-card media-card--4-5"></div>
        </div>

        <div class="slider__controls">
          <button class="slider__button slider__button--prev" type="button" aria-label="Föregående bild">←</button>
          <button class="slider__button slider__button--next" type="button" aria-label="Nästa bild">→</button>
        </div>
      </section>
      <!-- Arbeten -->
      <section class="work" id="case" aria-labelledby="work-title">
        <h2 id="work-title" class="visually-hidden">Arbeten</h2>
        <!-- role-attributen behåller tabellens betydelse för skärmläsare trots att CSS gör om layouten -->
        <table class="work__table" role="table">
          <thead role="rowgroup">
            <tr class="work__row work__head" role="row">
              <th class="work__nr" role="columnheader" scope="col">NR</th>
              <th class="work__project" role="columnheader" scope="col">Project</th>
              <th class="work__role" role="columnheader" scope="col">Role</th>
              <th class="work__year" role="columnheader" scope="col">Year</th>
              <th class="work__file" role="columnheader" scope="col">file</th>
            </tr>
          </thead>
          <tbody role="rowgroup">
              <tr class="work__row" role="row">
                <td class="work__nr body" role="cell">1</td>
                <td class="work__project sub-heading" role="cell">Campaign Animation</td>
                <td class="work__role body" role="cell">Role</td>
                <td class="work__year body" role="cell">2026</td>
                <td class="work__file body" role="cell">file</td>
              </tr>
              <tr class="work__row" role="row">
                <td class="work__nr body" role="cell">2</td>
                <td class="work__project sub-heading" role="cell">Farmmate - App</td>
                <td class="work__role body" role="cell">Role</td>
                <td class="work__year body" role="cell">2026</td>
                <td class="work__file body" role="cell">file</td>
              </tr>
              <tr class="work__row" role="row">
                <td class="work__nr body" role="cell">3</td>
                <td class="work__project sub-heading" role="cell">TON - App</td>
                <td class="work__role body" role="cell">Role</td>
                <td class="work__year body" role="cell">2026</td>
                <td class="work__file body" role="cell">file</td>
              </tr>
              <tr class="work__row" role="row">
                <td class="work__nr body" role="cell">4</td>
                <td class="work__project sub-heading" role="cell">SPÅR</td>
                <td class="work__role body" role="cell">Role</td>
                <td class="work__year body" role="cell">2026</td>
                <td class="work__file body" role="cell">file</td>
              </tr>
          </tbody>
        </table>
      </section>
      <!-- Steg 7: Kompetenser -->
      <!-- Steg 8: Text      (id="about") -->
    </main>

    <!-- Kontakt (id="contact") -->
  </div>
</body>
</html>
